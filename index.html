<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación de Autenticidad de Diploma</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #f8f9fa;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <iframe id="visorDiploma" title="Verificación de Diploma"></iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    const idDiploma = params.get('id');
    const urlBaseScript = "https://script.google.com/macros/s/AKfycbxxuHNdrzrDxhQDcKCZRoUr3m1Aa_qwyxyHZBRv8vwBxydl4nNhkn9cKYk8ict_5zCM/exec";

    const visor = document.getElementById('visorDiploma');
    if (idDiploma) {
      visor.src = urlBaseScript + "?id=" + encodeURIComponent(idDiploma);
    } else {
      visor.src = urlBaseScript;
    }
  </script>

</body>
</html>
